[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skullfix-ai"
version = "0.1.0"
description = "Shared AI/backend contracts for SkullFix"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.12.5",
  "fastapi==0.162.7",
  "uvicorn==0.54.0",
  "python-multipart==0.0.33",
  "brotli==1.2.1",
  "zstandard==0.25.0",
  "langgraph==1.2.22",
  "langchain-google-genai==4.5.0",
  "langchain-aws==1.9.3",
  "boto3==1.44.3",
  "numpy==2.5.4",
  "scipy==1.18.1",
  "deepagents==0.7.38",
  "langchain-community==0.4.2",
  "wikipedia==1.4.0",
  "arxiv==4.1.0",
  "xmltodict==1.0.4",
  "reportlab==5.1.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==9.2.0", "pypdf==7.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skullfix_ai = ["agent/*.md"]
