[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skullfix-ai"
version = "0.1.0"
description = "Shared AI/backend contracts for SkullFix"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.12.5",
]

[tool.setuptools.packages.find]
where = ["src"]
