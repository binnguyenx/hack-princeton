[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skullfix-ai"
version = "0.1.0"
description = "Shared AI/backend contracts for SkullFix"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.12.5",
  "fastapi==0.162.7",
  "uvicorn==0.54.0",
  "python-multipart==0.0.33",
  "brotli==1.2.1",
  "zstandard==0.25.0",
  "langgraph==1.2.22",
]

[project.optional-dependencies]
test = ["httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]
